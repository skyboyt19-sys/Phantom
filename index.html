<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Wallet</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #0b0b0b;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar { display: none; }

        .text-gray { color: #8e8e93; }
        .text-green { color: #30d158; }
        .text-red { color: #ff453a; }
        .text-purple { color: #a78bfa; }
        .text-white { color: #fff; }
        .font-bold { font-weight: 600; }
        .text-sm { font-size: 0.85rem; }
        .text-xs { font-size: 0.75rem; }
        .text-lg { font-size: 1.2rem; }
        .text-xl { font-size: 1.5rem; }
        .text-2xl { font-size: 2rem; }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-8 { margin-top: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .p-4 { padding: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .w-full { width: 100%; }
        .rounded-full { border-radius: 9999px; }
        .rounded-xl { border-radius: 1rem; }

        .status-bar { display: flex; justify-content: space-between; padding: 10px 20px; font-size: 0.8rem; font-weight: 600; }
        
        .top-nav { display: flex; gap: 10px; overflow-x: auto; padding: 10px 16px; }
        .nav-btn { background: #1c1c1e; border: none; color: #8e8e93; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .nav-btn.active { background: #a78bfa; color: #000; }

        .bottom-nav { display: flex; justify-content: space-around; padding: 15px 10px 25px 10px; background: #0b0b0b; border-top: 1px solid #1c1c1e; position: absolute; bottom: 0; width: 100%; z-index: 10; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8e8e93; font-size: 0.7rem; cursor: pointer; }
        .bottom-nav-item.active { color: #a78bfa; }

        .search-bar { background: #1c1c1e; border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 8px; margin: 0 16px 16px 16px; }
        .search-bar input { background: transparent; border: none; color: #fff; outline: none; flex-grow: 1; font-size: 0.95rem; }

        .card { background: #1c1c1e; border-radius: 16px; padding: 16px; margin: 0 16px 12px 16px; cursor: pointer; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; }
        .list-item:active { background: #1c1c1e; }
        .icon-wrapper { width: 40px; height: 40px; border-radius: 50%; background: #2c2c2e; display: flex; justify-content: center; align-items: center; margin-right: 12px; overflow: hidden; }
        .icon-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .sidebar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 20; padding: 20px; display: flex; flex-direction: column; transition: transform 0.3s ease; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-item { display: flex; align-items: center; gap: 16px; padding: 16px 0; font-size: 1.1rem; font-weight: 500; cursor: pointer; color: #fff; }
        
        .tabs { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 16px; overflow-x: auto; }
        .tab { background: #1c1c1e; border: none; color: #8e8e93; padding: 8px 16px; border-radius: 20px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .tab.active { background: #fff; color: #000; }

        .news-item { border-bottom: 1px solid #1c1c1e; padding: 16px 0; }

        .splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #a78bfa; display: flex; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.5s ease;
        }
        .ghost-icon { width: 120px; height: 120px; fill: white; animation: float 2s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    // Start-Daten mit hohen Werten
    const initialData = {
        recently: [
            { id: 1, name: 'HANTA', price: 150.45, change: -4.49, mc: '$45M MC', isPositive: false, img: 'https://via.placeholder.com/40/30d158/ffffff?text=H' }
        ],
        popular: [
            { id: 2, name: 'SPIKE', price: 1540.20, change: 24640, mc: '$2.4B MC', isPositive: true, img: 'https://via.placeholder.com/40/ff9f0a/ffffff?text=S' },
            { id: 3, name: 'DUEL', price: 850.64, change: 6520, mc: '$2.6B MC', isPositive: true, img: 'https://via.placeholder.com/40/ff453a/ffffff?text=D' },
            { id: 4, name: 'GP', price: 320.78, change: 177.2, mc: '$27B MC', isPositive: true, img: 'https://via.placeholder.com/40/ffd60a/000000?text=G' },
            { id: 5, name: 'ZEC', price: 1509.40, change: 0.00, mc: '$20B MC', isPositive: true, img: 'https://via.placeholder.com/40/ffd60a/000000?text=Z' }
        ],
        trending: [
            { id: 6, name: 'ENA', price: 12.20, change: -0.90, mc: '$2.1B MC', isPositive: false, img: 'https://via.placeholder.com/40/fff/000?text=E' },
            { id: 7, name: 'GP', price: 320.76, change: 147.3, mc: '$27B MC', isPositive: true, img: 'https://via.placeholder.com/40/ffd60a/000000?text=G' },
            { id: 8, name: 'SPIKE', price: 1540.51, change: 475.3, mc: '$2.5B MC', isPositive: true, img: 'https://via.placeholder.com/40/ff9f0a/ffffff?text=S' },
            { id: 9, name: 'MUSEBOOK', price: 84.26, change: -36.18, mc: '$26B MC', isPositive: false, img: 'https://via.placeholder.com/40/fff/000?text=M' },
            { id: 10, name: 'DUEL', price: 850.61, change: 6282, mc: '$2.6B MC', isPositive: true, img: 'https://via.placeholder.com/40/ff453a/ffffff?text=D' }
        ],
        news: [
            { id: 1, sources: '199 Quellen • 7h', title: 'Senate rejects CLARITY Act in 49-50 procedural vote, triggering $669.71 million in...', ticker: 'BTC', change: '-2.4%', isPositive: false },
            { id: 2, sources: '29 Quellen • 3h', title: 'CME Group plans to launch Bitcoin Cash and Uniswap futures on October 19 as BCH surge...', ticker: 'BCH', change: '-2.4%', isPositive: false }
        ]
    };

    const TokenRow = ({ token }) => {
        const formatPrice = (num) => {
            return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        return (
            <div className="list-item">
                <div className="flex items-center">
                    <div className="icon-wrapper">
                        <img src={token.img} alt={token.name} />
                    </div>
                    <div className="flex flex-col">
                        <span className="font-bold text-white text-lg">{token.name}</span>
                        <span className="text-gray text-sm">{token.mc}</span>
                    </div>
                </div>
                <div className="flex flex-col items-end">
                    <span className="font-bold text-white text-lg">{formatPrice(token.price)}</span>
                    <span className={token.isPositive ? "text-green text-sm" : "text-red text-sm"}>
                        {token.isPositive ? '+' : ''}{token.change.toLocaleString('en-US')}%
                    </span>
                </div>
            </div>
        );
    };

    const Sidebar = ({ isOpen, onClose }) => (
        <div className={`sidebar ${isOpen ? 'open' : ''}`}>
            <div className="flex justify-between items-center mb-8">
                <div className="flex items-center gap-2">
                    <div className="icon-wrapper" style={{ width: 30, height: 30 }}>
                        <img src="https://via.placeholder.com/30/fff/000?text=W" alt="Wallet" />
                    </div>
                    <span className="font-bold">@RobinSchindler</span>
                </div>
                <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer', fontSize: '1.5rem' }}>
                    ✕
                </button>
            </div>
            <div className="text-purple font-bold mb-8 flex items-center gap-2 text-sm">
                Verbinden Sie Ihr X-Konto
            </div>
            
            <div className="flex items-center gap-2 mb-8 p-2 rounded-xl bg-[#1c1c1e]">
                <div className="w-6 h-6 rounded-full bg-[#2c2c2e] flex items-center justify-center text-xs font-bold">K1</div>
                <span className="font-bold">Konto 1</span>
            </div>

            <div className="flex flex-col gap-4">
                <div className="sidebar-item">👤 Profil</div>
                <div className="sidebar-item">💬 Chats</div>
                <div className="sidebar-item">❤️ Watchlist</div>
                <div className="sidebar-item">🕒 Verlauf</div>
            </div>

            <div className="mt-auto flex flex-col gap-4 mb-8">
                <div className="sidebar-item">⚙️ Einstellungen</div>
                <div className="sidebar-item">ℹ️ Hilfe & Support</div>
            </div>
        </div>
    );

    const App = () => {
        const [isLoading, setIsLoading] = useState(true);
        const [activeTab, setActiveTab] = useState('Start');
        const [isSidebarOpen, setIsSidebarOpen] = useState(false);
        const [data, setData] = useState(initialData);
        const [balance, setBalance] = useState(700000.00); 

        useEffect(() => {
            const timer = setTimeout(() => {
                setIsLoading(false);
            }, 3000);
            return () => clearTimeout(timer);
        }, []);

        useEffect(() => {
            if (isLoading) return;
            const interval = setInterval(() => {
                setBalance(prev => prev + (Math.random() * 400 - 200));
                setData(prevData => {
                    const updateArray = (arr) => arr.map(token => {
                        const fluctuation = (Math.random() * 0.02) - 0.01;
                        const newPrice = token.price * (1 + fluctuation);
                        return { ...token, price: newPrice };
                    });
                    return {
                        ...prevData,
                        recently: updateArray(prevData.recently),
                        popular: updateArray(prevData.popular),
                        trending: updateArray(prevData.trending)
                    };
                });
            }, 2000);
            return () => clearInterval(interval);
        }, [isLoading]);

        const formatBalance = (num) => {
            return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const solPrice = 1250.75;
        const solBalance = 0.00092 * solPrice;
        const formatSol = (num) => {
            return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const renderContent = () => {
            switch (activeTab) {
                case 'Start':
                    return (
                        <div className="flex flex-col h-full">
                            <div className="flex justify-between items-center p-4">
                                <div className="icon-wrapper" style={{ width: 32, height: 32, cursor: 'pointer' }} onClick={() => setIsSidebarOpen(true)}>
                                    <img src="https://via.placeholder.com/32/fff/000?text=W" alt="Wallet" />
                                </div>
                                <div className="flex items-center gap-2 bg-[#1c1c1e] px-3 py-1 rounded-full text-sm font-bold">
                                    <span>Konto 1</span>
                                    <span>▼</span>
                                </div>
                                <div className="icon-wrapper" style={{ width: 32, height: 32 }}>
                                    <span>🔍</span>
                                </div>
                            </div>

                            <div className="px-4 mb-6">
                                <div className="flex items-center gap-2 text-gray text-sm font-bold mb-1">
                                    <span>Konto 1</span>
                                    <span>▼</span>
                                </div>
                                <div className="text-4xl font-bold mb-1">{formatBalance(balance)}</div>
                                <div className="text-red text-sm font-bold flex items-center gap-1">
                                    <span>-${(Math.random() * 100).toFixed(2)}</span>
                                    <span className="bg-[#ff453a] text-white px-1.5 py-0.5 rounded text-xs">-0.10%</span>
                                </div>
                            </div>

                            <div className="card flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <span>💳</span>
                                    <span className="font-bold">Cash</span>
                                </div>
                                <span className="font-bold">&lt;$0.01</span>
                            </div>

                            <div className="px-4 mb-2 flex justify-between items-center mt-4">
                                <span className="font-bold text-lg">Token</span>
                                <span className="text-gray">›</span>
                            </div>
                            
                            <div className="card flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-black flex justify-center items-center overflow-hidden">
                                        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" alt="SOL" className="w-full h-full object-cover" />
                                    </div>
                                    <div>
                                        <div className="font-bold">Solana</div>
                                        <div className="text-gray text-xs">0.00092 SOL</div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="font-bold">{formatSol(solBalance)}</div>
                                    <div className="text-red text-xs">-&lt;$0.01</div>
                                </div>
                            </div>

                            <div className="px-4 mb-2 flex justify-between items-center mt-4">
                                <span className="font-bold text-lg">Perps</span>
                                <span className="text-gray">›</span>
                            </div>
                            <div className="flex gap-4 px-4 overflow-x-auto pb-4">
                                {['BTC', 'ETH', 'ZE'].map((item, i) => (
                                    <div key={i} className="card flex-1 min-w-[100px] p-3 flex flex-col items-center">
                                        <div className="w-10 h-10 rounded-full bg-[#2c2c2e] flex justify-center items-center mb-2">
                                            <span className="font-bold text-sm">{item}</span>
                                        </div>
                                        <span className="font-bold text-xs mb-1">{item}</span>
                                        <span className="text-red text-xs">-2.49%</span>
                                    </div>
                                ))}
                            </div>

                            <div className="px-4 mb-2 flex justify-between items-center mt-4">
                                <span className="font-bold text-lg">Vorhersagen</span>
                                <span className="text-gray">›</span>
                            </div>
                            <div className="search-bar">
                                <span>🔍</span>
                                <input type="text" placeholder="Phantom durchsuchen" />
                                <span>✕</span>
                            </div>
                        </div>
                    );

                case 'Handel':
                    return (
                        <div className="flex flex-col h-full">
                            <div className="px-4 py-2">
                                <h1 className="text-3xl font-bold mb-1">Hot Markets</h1>
                                <p className="text-gray text-sm flex items-center gap-1">👤 Basierend auf Händleraktivität</p>
                            </div>

                            <div className="card bg-[#1c1c1e] p-4 flex flex-col gap-2 mx-4 mb-6">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <div className="w-8 h-8 rounded-full bg-[#30d158] flex justify-center items-center text-black font-bold">H</div>
                                        <span className="font-bold">xHYPE</span>
                                    </div>
                                    <div className="text-right">
                                        <div className="font-bold">$2,730.00</div>
                                        <div className="text-red text-xs">-7.65%</div>
                                    </div>
                                </div>
                                <div className="w-full h-8 flex items-end justify-end">
                                    <svg width="100" height="30" viewBox="0 0 100 30">
                                        <path d="M0,20 L10,15 L20,25 L30,10 L40,15 L50,5 L60,20 L70,15 L80,25 L90,10 L100,20" fill="none" stroke="#ff453a" strokeWidth="2"/>
                                    </svg>
                                </div>
                                <div className="text-gray text-xs flex items-center gap-1">↗ 23.1k traders in 4h</div>
                            </div>

                            <div className="px-4 mb-4 flex justify-between items-center">
                                <span className="font-bold text-xl">Explore Markets</span>
                                <span className="text-gray">›</span>
                            </div>

                            <div className="t classNameabs">
                               =" <button className="texttab active">Trending</button-white>
                                <button className="tab text">Perps</button-xs>
                                <button className="tab">Robinhood Cha</button>
                            </div>

                            <div className="flex flex-col">
                                {data.trending.map(token => <TokenRow key={token.id} token={token} />)}
                            </div>
                        </div>
                    );

                case 'Erkunden':
                    return (
                        <div className="flex flex-col h-full">
                            <div className="tabs mt-2">
                                <button className="tab active flex items-center gap-2">○ Token</button>
                                <button className="tab flex items-center gap-2">∞ Perps</button>
                                <button className="tab flex items-center gap-2">🌐 Websites</button>
                            </div>

                            <div className="px-4 mb-4 flex justify-between items-center mt-2">
                                <span className="font-bold text-xl">Beliebte Token</span>
                                <span className="text-gray">›</span>
                            </div>

                            <div className="flex flex-col mb-6">
                                {data.popular.slice(0, 3).map(token => <TokenRow key={token.id} token={token} />)}
                            </div>

                            <div className="px-4 mb-4 flex justify-between items-center">
                                <span className="font-bold text-xl">Was passiert</span>
                                <span className="text-gray">›</span>
                            </div>

                            <div className="px-4">
                                {data.news.map(news => (
                                    <div key={news.id} className="news-item">
                                        <div className="text-gray text-xs mb-1">{news.sources}</div>
                                        <div className="text-white text-sm font-medium mb-2">{news.title}</div>
                                        <div className="flex items-center gap-2">
                                            <span font-bold">{news.ticker}</span>
                                            <span className={news.isPositive ? "text-green text-xs font-bold" : "text-red text-xs font-bold"}>{news.change}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );

                case 'Vorhersage':
                    return <div className="p-4 flex justify-center items-center h-full text-gray">Vorhersage Ansicht</div>;
                
                default:
                    return null;
            }
        };

        if (isLoading) {
            return (
                <div className="splash-screen">
                    <svg className="ghost-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10C30 10 15 25 15 45V80C15 85 20 88 24 85L35 78L45 85C48 87 52 87 55 85L65 78L76 85C80 88 85 85 85 80V45C85 25 70 10 50 10ZM35 45C35 40 40 35 45 35C50 35 55 40 55 45C55 50 50 55 45 55C40 55 35 50 35 45ZM65 45C65 50 60 55 55 55C50 55 45 50 45 45C45 40 50 35 55 35C60 35 65 40 65 45Z" />
                    </svg>
                </div>
            );
        }

        return (
            <div id="app-container">
                <div className="status-bar">
                    <span>22:30</span>
                    <div className="flex items-center gap-1">
                        <span>🔔</span>
                        <span>📶</span>
                        <span className="bg-white text-black px-1 rounded text-xs font-bold">61</span>
                    </div>
                </div>

                <div className="top-nav">
                    {['Start', 'Handel', 'Vorhersage', 'Erkunden'].map(tab => (
                        <button 
                            key={tab} 
                            className={`nav-btn ${activeTab === tab ? 'active' : ''}`}
                            onClick={() => setActiveTab(tab)}
                        >
                            {tab}
                        </button>
                    ))}
                </div>

                <div className="flex-grow overflow-y-auto pb-20">
                    {renderContent()}
                </div>

                <div className="bottom-nav">
                    <div className={`bottom-nav-item ${activeTab === 'Start' ? 'active' : ''}`} onClick={() => setActiveTab('Start')}>
                        <span style={{ fontSize: '1.2rem' }}>🏠</span>
                        <span>Start</span>
                    </div>
                    <div className={`bottom-nav-item ${activeTab === 'Handel' ? 'active' : ''}`} onClick={() => setActiveTab('Handel')}>
                        <span style={{ fontSize: '1.2rem' }}>📊</span>
                        <span>Handel</span>
                    </div>
                    <div className={`bottom-nav-item ${activeTab === 'Erkunden' ? 'active' : ''}`} onClick={() => setActiveTab('Erkunden')}>
                        <span style={{ fontSize: '1.2rem' }}>🧭</span>
                        <span>Erkunden</span>
                    </div>
                    <div className="bottom-nav-item" onClick={() => setIsSidebarOpen(true)}>
                        <span style={{ fontSize: '1.2rem' }}>👤</span>
                        <span>Profil</span>
                    </div>
                </div>

                <Sidebar isOpen={isSidebarOpen} onClose={() => setIsSidebarOpen(false)} />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

</script>
</body>
</html>
